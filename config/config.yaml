seed: 42
# 리스크 산출 기준일. 이 값이 바뀌면 데이터 구간이 달라져 computation_hash 가
# 반드시 바뀐다. 그래서 "어제"처럼 흐르는 값이 아니라 고정값으로 둔다 — 매일
# 달라지면 재현 선언 §2(무조건 보장)가 성립할 수 없다.
# 갱신은 임의로 하지 않고 **기준선 재선언과 함께만** 한다.
#   2026-07-03 : 7월 과제 기준일 (근거 미기록)
#   2026-08-28 : 9월 과제 착수 시점의 최근 영업일로 갱신.
#                자산군 확장(gold·reits)으로 어차피 해시를 새로 잡는 김에 함께 옮겼다.
as_of_date: "2026-08-28"
base_currency: KRW
rf_rate: 0.0325
var_confidence: 0.99
horizons: [1, 10]
# Historical VaR/CVaR 관측 기간(거래일). methodology_var_cvar_2026 §3 참조.
# 1250 거래일(약 5년) — 99% 신뢰수준의 꼬리 관측치를 250일(약 2~3개)보다
# 크게 늘려(약 12개) 통계적 안정성을 확보했다. 5년이면 최소 1회의 위기
# 국면(금리 급등기 등)을 포함할 가능성이 높아 꼬리 리스크 포착에도 유리하다.
# 대신 오래된 저변동성 구간이 섞여 반응성은 250~500일보다 낮다.
var_lookback_days: 1250
# 수익률 데이터 출처. "real"=yfinance 실데이터(기본, 로컬 parquet 캐시 —
# Yahoo Finance 재배포 제약으로 git 미커밋, 발표 전 1회 실행으로 예열),
# "dummy"=고정 수식 더미(네트워크 불요, 오프라인 개발/테스트용).
data_source: real
# 제출·시연에서는 검증 통과 인용이 없으면 judge를 반드시 실패시킨다.
strict_citation_gate: true
# judge 재작성 루프(분기 ③)의 최대 시도 횟수 유일 원천(SSOT).
# 코드·문서·발표에는 이 숫자를 복제하지 않고 이 키를 참조한다. 소진 실패 시
# manual_review_gate에서 확정·다운로드를 차단하고 사람 검토로 넘긴다.
judge_max_retries: 3

# ── 세금·비용 (2026-09 추가) ─────────────────────────────────────────────
#
#  9월 과제 요구: "세금은 '세금이 얼마'만이 아니라 세전 → 세금 → 비용 →
#  세후 기말자산으로 볼 수 있게 할 것 (추정 범위는 명시)"
#
#  ⚠️ 중간발표 지적 — "단순 세금 하나로 절세를 했다면 개망한 거임".
#     그래서 **다루는 세목을 좁게 선언하고 범위 밖을 리포트에 명시**한다.
#     '절세 최적화' 라는 표현은 쓰지 않는다(핸드아웃 금지 항목).
#
#  세율은 코드에 박지 않고 여기 둔다 — judge_eval 의 min(score, 0.4) 처럼
#  근거 없는 상수가 되지 않게, 값마다 출처와 기준일을 함께 적는다.
tax:
  # 다루는 세목. 이 목록 밖은 계산하지 않고 리포트에 '범위 밖'으로 적는다.
  scope: financial_income          # 금융소득(이자·배당)만
  # 이자·배당 원천징수 세율. 소득세 14% + 지방소득세 1.4%.
  # 근거: corpus/house_view 채권전략 자료의 "15.4%의 세율을 적용할 경우".
  withholding_rate: 0.154
  withholding_rate_source: "코퍼스 채권전략 자료 — 이자·배당 원천징수 15.4%"
  # 금융소득종합과세 기준금액(연간 이자+배당 합계). 초과분은 종합과세된다.
  # ⚠️ 이 값의 근거를 코퍼스에서 아직 확정하지 못했다. 통용되는 기준을
  #    가정값으로 두고 리포트에 '가정'으로 표기한다. 확정되면 출처를 채운다.
  comprehensive_threshold_krw: 20000000
  comprehensive_threshold_source: "가정 — 코퍼스 근거 미확정"
  # 종합과세 최고 세율(지방소득세 포함). 근거: 같은 자료의 "49.5%".
  comprehensive_top_rate: 0.495
  comprehensive_top_rate_source: "코퍼스 채권전략 자료 — 최고 49.5%"
  # 추정 범위. 종합과세 구간은 다른 소득에 따라 달라지므로 하한은 원천징수
  # 세율, 상한은 최고 세율로 잡아 **구간으로** 보여준다.
  estimate_band: [0.154, 0.495]
  # 계산하지 않는 세목 — 리포트에 그대로 적는다.
  out_of_scope:
    - "양도소득세 (국내주식 소액주주 비과세 / 해외주식 22%)"
    - "종합부동산세"
    - "상속세 · 증여세"
    - "금융투자소득세 — 2024년 말 폐지 (코퍼스 채권전략 자료 근거)"

# 자산군별 연간 보수(비용). **현재 가정값이며 출처 미확정**이다.
# 실제 상품 보수는 공개값이므로 확정되면 fee_source 를 채운다.
# 리포트에는 '가정'으로 표기한다 — 근거 없는 값을 확정처럼 쓰지 않는다.
fee_annual:
  domestic_equity: 0.0030
  global_equity: 0.0015
  domestic_bond: 0.0015
  global_bond: 0.0035
  gold: 0.0040
  reits: 0.0012
  cash: 0.0
fee_source: "가정 — 유사 상품 수준 참고, 출처 미확정"
