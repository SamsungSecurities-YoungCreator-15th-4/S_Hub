# pip 블록은 `directory: "/"` 하나로 둔다.
# 실측: 이 블록이 루트 requirements.txt 와 backend/requirements.txt 를 **둘 다** 스캔한다.
# (2026-08-31 첫 실행에서 확인 — `/backend` 블록을 따로 두었더니 같은 업데이트가 두 번 열렸다)
#
# target-branch 는 두지 않는다. main 이 이미 기본 브랜치라 불필요하고,
# 이 옵션을 켜면 보안 업데이트 PR 생성 방식이 달라진다.
#
# 주기는 monthly 다 — 정기 버전 업데이트는 발표 준비에 방해가 되지 않을 만큼만 받는다.
# 실제 취약점(Dependabot security update)은 이 주기와 무관하게 즉시 열리므로
# 주기를 낮춰도 보안 커버리지는 그대로다.
#
# major 업그레이드는 자동으로 열지 않는다. 판단이 필요한 변경이라 사람이 시점을 고른다.
# (첫 실행에서 openai 2→3, typescript 5→6, actions 4→7 이 한꺼번에 열렸다)
version: 2
updates:
  # 파이썬 — 루트 requirements.txt(엔진) + backend/requirements.txt(대시보드)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    groups:
      langstack:
        patterns:
          - "langchain*"
          - "langgraph*"
          - "langsmith"
    ignore:
      # Dependabot에는 pip 프리릴리스 전역 제외 옵션이 없어 알려진 RC를 명시하고,
      # 향후 프리릴리스 고정은 release preflight와 CI에서 차단한다.
      - dependency-name: "langgraph"
        versions:
          - "1.0.10rc1"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # 대시보드 프론트 — frontend/package.json (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # CI 액션 핀 — 공급망 관점에서 pip/npm 과 동급으로 본다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
